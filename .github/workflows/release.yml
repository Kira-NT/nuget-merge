name: release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      github-tag:
        description: The GitHub tag (e.g., v1.2.3) to build and release from.
        type: string
        required: true
      skip-nuget-upload:
        description: Set to true to skip publishing the NuGet package during this run.
        type: boolean
        default: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
  NUGET_XMLDOC_MODE: skip
  BUILD_OUTPUT: ${{ github.workspace }}/dist
  CI_RELEASE: true

permissions:
  id-token: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6

      - name: Create NuGet packages
        run: dotnet pack -o "${{ env.BUILD_OUTPUT }}"

      - name: Fetch NuGet API Key
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ github.repository_owner }}

      - name: Upload NuGet packages to GitHub
        uses: Kira-NT/mc-publish@v3
        with:
          files: ${{ env.BUILD_OUTPUT }}/*.nupkg
          github-tag: ${{ inputs.github-tag || '${undefined}' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload NuGet packages to nuget.org
        if: ${{ !inputs.skip-nuget-upload }}
        run: dotnet nuget push "${{ env.BUILD_OUTPUT }}/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json"

  compile:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            rid: linux-glibc-x64
            type: UpxCompressed

          - runner: ubuntu-24.04-arm
            rid: linux-glibc-arm64
            type: UpxCompressed

          - runner: windows-latest
            rid: windows-x64
            type: UpxCompressed

          - runner: windows-11-arm
            rid: windows-arm64
            type: Ilc

          - runner: macos-latest
            rid: macos-arm64
            type: Ilc

          - runner: macos-15-intel
            rid: macos-x64
            type: Ilc
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        id: dotnet
        uses: actions/setup-dotnet@v6

      - name: Build
        shell: bash
        run: dotnet publish src/NuGetMerge -o "${{ env.BUILD_OUTPUT }}" --ucr -f "net$(printf "%s" "${{ steps.dotnet.outputs.dotnet-version }}" | cut -d. -f1-2)" -p:Publish${{ matrix.type }}=true

      - name: Get version
        id: get-version
        shell: bash
        run: |
          chmod +x "${{ env.BUILD_OUTPUT }}/nuget-merge"
          version=$("${{ env.BUILD_OUTPUT }}/nuget-merge" --version)
          echo "version=${version%%+*}" >> "$GITHUB_OUTPUT"

      - name: Zip artifacts
        if: ${{ startsWith(matrix.runner, 'windows') }}
        run: Compress-Archive -Path "${{ env.BUILD_OUTPUT }}/nuget-merge.exe" -DestinationPath "nuget-merge-${{ steps.get-version.outputs.version }}-${{ matrix.rid }}.zip"

      - name: Tar artifacts
        if: ${{ !startsWith(matrix.runner, 'windows') }}
        run: tar -czf "nuget-merge-${{ steps.get-version.outputs.version }}-${{ matrix.rid }}.tar.gz" -C "${{ env.BUILD_OUTPUT }}" nuget-merge

      - name: Upload artifacts to GitHub
        uses: Kira-NT/mc-publish@v3
        with:
          files: nuget-merge-*-*.*
          github-tag: ${{ inputs.github-tag || '${undefined}' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
